services:
  - type: web
    name: washwish
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py populate_data
    startCommand: gunicorn detergee.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.9.18"
      - key: DATABASE_URL
        fromDatabase:
          name: washwish-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "washwish.onrender.com,localhost,127.0.0.1"

databases:
  - name: washwish-db
    databaseName: washwish
    user: washwish
    plan: free