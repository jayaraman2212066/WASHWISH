services:
  - type: web
    name: washwish
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn detergee.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.9.18"
      - key: DATABASE_URL
        fromDatabase:
          name: washwish-db
          property: connectionString

databases:
  - name: washwish-db
    databaseName: washwish
    user: washwish